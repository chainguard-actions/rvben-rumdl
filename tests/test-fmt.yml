name: Test fmt rewrites files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare copy of bad file
        run: |
          rm -rf fmt-work
          mkdir -p fmt-work
          cp tests/fixtures/bad/bad.md fmt-work/bad.md
      - id: action
        uses: .
        with:
          command: fmt
          path: fmt-work
          fail-on-error: "false"
      - name: Assert file was rewritten
        run: |
          cat -A fmt-work/bad.md
          if cmp -s tests/fixtures/bad/bad.md fmt-work/bad.md; then
            echo "FAIL: file was not modified"
            exit 1
          fi
          if grep -q ' $' fmt-work/bad.md; then
            echo "FAIL: trailing spaces remain"
            exit 1
          fi
          echo "PASS"
