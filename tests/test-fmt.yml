name: Test fmt rewrites files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown with trailing whitespace
        run: |
          mkdir -p "$RUNNER_TEMP/md-fmt"
          printf '# Title\n\nSome text with trailing space. \n' > "$RUNNER_TEMP/md-fmt/bad.md"
      - id: action
        uses: .
        with:
          command: fmt
          path: ${{ runner.temp }}/md-fmt/bad.md
          config: tests/fixtures/rumdl-test.toml
      - name: Assert file was fixed
        run: |
          f="$RUNNER_TEMP/md-fmt/bad.md"
          cat -A "$f"
          if grep -q ' $' "$f"; then echo "FAIL: trailing whitespace remains"; exit 1; fi
          if ! grep -q 'Some text with trailing space.' "$f"; then echo "FAIL: content lost"; exit 1; fi
          echo "PASS"
