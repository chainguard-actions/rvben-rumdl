name: Test invalid install-only value errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          install-only: "yes"
      - name: Assert failure without install
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "outcome: $OUTCOME version: '$VERSION'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid install-only"
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            echo "FAIL: should fail before installing"
            exit 1
          fi
          echo "PASS"
