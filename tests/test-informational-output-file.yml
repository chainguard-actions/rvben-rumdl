name: Test fail-on-error false with output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown with trailing whitespace
        run: |
          mkdir -p "$RUNNER_TEMP/md-info"
          printf '# Title\n\nSome text with trailing space. \n' > "$RUNNER_TEMP/md-info/bad.md"
      - id: action
        uses: .
        with:
          path: ${{ runner.temp }}/md-info/bad.md
          config: tests/fixtures/rumdl-test.toml
          fail-on-error: "false"
          output-file: ${{ runner.temp }}/results/out.txt
      - name: Assert output file has violation
        run: |
          f="$RUNNER_TEMP/results/out.txt"
          if [ ! -f "$f" ]; then echo "FAIL: output file missing"; exit 1; fi
          cat "$f"
          if ! grep -q "MD009" "$f"; then echo "FAIL: expected MD009 in results"; exit 1; fi
          echo "PASS"
