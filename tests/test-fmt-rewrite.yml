name: Test fmt command rewrites files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file to format
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/md-rewrite"
          # Write a simple markdown file
          cat > "$GITHUB_WORKSPACE/tests/fixtures/md-rewrite/to-format.md" << 'EOF'
          # Title

          Some content here.

          ## Section

          More content.
          EOF

      - id: action
        uses: .
        with:
          command: fmt
          path: tests/fixtures/md-rewrite/to-format.md

      - name: Assert action succeeded
        run: |
          echo "PASS: fmt command completed successfully"

      - name: Assert file still exists after formatting
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/md-rewrite/to-format.md" ]; then
            echo "FAIL: file was removed by fmt command"
            exit 1
          fi
          echo "File contents after fmt:"
          cat "$GITHUB_WORKSPACE/tests/fixtures/md-rewrite/to-format.md"
          echo "PASS: file exists after formatting"

      - name: Assert rumdl-version output is set
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "rumdl-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version output is empty"
            exit 1
          fi
          echo "PASS"
