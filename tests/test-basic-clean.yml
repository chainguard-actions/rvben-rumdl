name: Test basic check on clean markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare input files
        run: |
          mkdir -p rumdl-input
          printf '[MD013]\nline-length = 200\n' > rumdl-input/rumdl.toml
          printf '# Title\n\nSome clean text.\n' > rumdl-input/clean.md
      - id: action
        uses: .
        with:
          path: rumdl-input/clean.md
          config: rumdl-input/rumdl.toml
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
          RPATH: ${{ steps.action.outputs.rumdl-path }}
        run: |
          echo "version: $VERSION"
          echo "path: $RPATH"
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version output empty"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: rumdl-version does not look like a version"
            exit 1
          fi
          if [ ! -x "$RPATH" ]; then
            echo "FAIL: rumdl-path is not an executable file"
            exit 1
          fi
          echo "PASS"
