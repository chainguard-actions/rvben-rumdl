name: Test basic check on clean file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean.md
          config: tests/fixtures/rumdl.toml
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
          RPATH: ${{ steps.action.outputs.rumdl-path }}
        run: |
          echo "version: $VERSION"
          echo "path: $RPATH"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: rumdl-version is not a semver: '$VERSION'"
            exit 1
          fi
          case "$VERSION" in
            rumdl*) echo "FAIL: version should not include 'rumdl' prefix"; exit 1 ;;
          esac
          if [ -z "$RPATH" ] || [ ! -x "$RPATH" ]; then
            echo "FAIL: rumdl-path '$RPATH' is not an executable"
            exit 1
          fi
          "$RPATH" --version
          echo "PASS"
