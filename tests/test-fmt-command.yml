name: Test fmt command rewrites files in place
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file to format
        run: |
          mkdir -p /tmp/md-fmt-rw
          printf '# Title\n\nThis is a paragraph.\n\n## Section\n\nSome content.\n' \
            > /tmp/md-fmt-rw/doc.md

      - id: action
        uses: .
        with:
          command: fmt
          path: /tmp/md-fmt-rw/doc.md

      - name: Assert action succeeded and file still exists
        run: |
          if [ ! -f /tmp/md-fmt-rw/doc.md ]; then
            echo "FAIL: formatted file no longer exists"
            exit 1
          fi
          echo "File after fmt:"
          cat /tmp/md-fmt-rw/doc.md
          echo "PASS: fmt command completed successfully"

      - name: Assert rumdl-version output is set
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "rumdl-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version output is empty"
            exit 1
          fi
          echo "PASS: rumdl-version=$VERSION"

      - name: Assert rumdl-path output is set
        env:
          RUMDL_PATH: ${{ steps.action.outputs.rumdl-path }}
        run: |
          echo "rumdl-path: $RUMDL_PATH"
          if [ -z "$RUMDL_PATH" ]; then
            echo "FAIL: rumdl-path output is empty"
            exit 1
          fi
          echo "PASS: rumdl-path=$RUMDL_PATH"
