name: Test annotations report type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/bad
          report-type: annotations
          fail-on-error: "false"
          output-file: annotations.txt
      - name: Assert github-format annotations
        run: |
          cat annotations.txt
          if ! grep -qE '^::(warning|error)' annotations.txt; then
            echo "FAIL: expected GitHub annotation lines"
            exit 1
          fi
          echo "PASS"
