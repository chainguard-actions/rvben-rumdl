name: Test fmt-check reports without rewriting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create unformatted markdown and config
        run: |
          mkdir -p "$RUNNER_TEMP/md"
          printf '# Title\n\nSome text. \n' > "$RUNNER_TEMP/md/bad.md"
          cp "$RUNNER_TEMP/md/bad.md" "$RUNNER_TEMP/bad.orig"
          printf '[global]\ndisable = ["MD033"]\n' > "$RUNNER_TEMP/rumdl-test.toml"
          echo "MD_DIR=$RUNNER_TEMP/md" >> "$GITHUB_ENV"
          echo "CFG=$RUNNER_TEMP/rumdl-test.toml" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: fmt-check
          path: ${{ env.MD_DIR }}/bad.md
          config: ${{ env.CFG }}
      - name: Assert failure and file unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected fmt-check to fail on unformatted file"
            exit 1
          fi
          if ! cmp -s "$MD_DIR/bad.md" "$RUNNER_TEMP/bad.orig"; then
            echo "FAIL: fmt-check modified the file"
            exit 1
          fi
          echo "PASS"
