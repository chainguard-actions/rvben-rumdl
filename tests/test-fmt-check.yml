name: Test fmt-check reports without modifying
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare copy of bad file
        run: |
          rm -rf fmtcheck-work
          mkdir -p fmtcheck-work
          cp tests/fixtures/bad/bad.md fmtcheck-work/bad.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: fmt-check
          path: fmtcheck-work
      - name: Assert failure and file unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if ! cmp -s tests/fixtures/bad/bad.md fmtcheck-work/bad.md; then
            echo "FAIL: fmt-check modified the file"
            exit 1
          fi
          echo "PASS"
