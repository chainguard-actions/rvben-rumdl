name: Test fmt-check fails without modifying files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare input files
        run: |
          mkdir -p rumdl-input
          printf '[MD013]\nline-length = 200\n' > rumdl-input/rumdl.toml
          printf '# Title\n\n#Bad heading\n' > rumdl-input/fmt.md
          cp rumdl-input/fmt.md rumdl-input/fmt.md.orig
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: fmt-check
          path: rumdl-input/fmt.md
          config: rumdl-input/rumdl.toml
      - name: Assert failure and file unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected fmt-check to fail on unformatted file"
            exit 1
          fi
          if ! cmp rumdl-input/fmt.md rumdl-input/fmt.md.orig; then
            echo "FAIL: fmt-check modified the file"
            exit 1
          fi
          echo "PASS"
