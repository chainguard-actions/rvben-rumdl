name: Test fmt-check does not modify files and fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare a copy of the bad file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fmtcheck-target"
          cp tests/fixtures/bad.md "$GITHUB_WORKSPACE/fmtcheck-target/bad.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: fmt-check
          path: fmtcheck-target/bad.md
          config: tests/fixtures/rumdl.toml
      - name: Assert failed and file unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected fmt-check to fail on unformatted file"
            exit 1
          fi
          if ! cmp -s tests/fixtures/bad.md fmtcheck-target/bad.md; then
            echo "FAIL: fmt-check modified the file"
            exit 1
          fi
          echo "PASS"
