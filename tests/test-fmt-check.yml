name: Test fmt-check reports without modifying
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare scratch copy
        run: |
          mkdir -p "$RUNNER_TEMP/fmtcheck"
          cp tests/act-fixtures/bad.md "$RUNNER_TEMP/fmtcheck/bad.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: fmt-check
          path: ${{ runner.temp }}/fmtcheck/bad.md
          args: --no-config
      - name: Assert failure and file unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILE: ${{ runner.temp }}/fmtcheck/bad.md
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected fmt-check to fail on unformatted file"
            exit 1
          fi
          if ! cmp -s "$FILE" tests/act-fixtures/bad.md; then
            echo "FAIL: fmt-check modified the file"
            exit 1
          fi
          echo "PASS"
