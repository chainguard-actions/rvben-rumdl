name: Test fmt-check reports unformatted file without modifying it
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare work copy
        run: |
          mkdir -p fmtcheck-work
          cp tests/fixtures/dirty.md fmtcheck-work/dirty.md
          sha256sum fmtcheck-work/dirty.md > /tmp/before.sha
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: fmt-check
          path: fmtcheck-work/dirty.md
          config: tests/fixtures/rumdl.toml
      - name: Assert failure and file unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: fmt-check should fail on unformatted file"
            exit 1
          fi
          if ! sha256sum -c /tmp/before.sha; then
            echo "FAIL: fmt-check modified the file"
            exit 1
          fi
          echo "PASS"
