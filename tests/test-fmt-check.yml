name: Test fmt-check reports and leaves files alone
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown with trailing whitespace
        run: |
          mkdir -p "$RUNNER_TEMP/md-fmtc"
          printf '# Title\n\nSome text with trailing space. \n' > "$RUNNER_TEMP/md-fmtc/bad.md"
          sha256sum "$RUNNER_TEMP/md-fmtc/bad.md" > "$RUNNER_TEMP/fmtc.sha"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: fmt-check
          path: ${{ runner.temp }}/md-fmtc/bad.md
          config: tests/fixtures/rumdl-test.toml
      - name: Assert failure and file unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          sha256sum -c "$RUNNER_TEMP/fmtc.sha" || { echo "FAIL: file was modified"; exit 1; }
          echo "PASS"
