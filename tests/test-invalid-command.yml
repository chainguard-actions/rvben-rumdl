name: Test invalid command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean markdown
        run: |
          mkdir -p "$RUNNER_TEMP/md"
          printf '# Title\n\nSome clean text.\n' > "$RUNNER_TEMP/md/clean.md"
          echo "MD_DIR=$RUNNER_TEMP/md" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: bogus
          path: ${{ env.MD_DIR }}/clean.md
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid command"
            exit 1
          fi
          echo "PASS"
