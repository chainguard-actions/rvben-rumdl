name: Test invalid command fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean markdown
        run: |
          mkdir -p "$RUNNER_TEMP/md-inv"
          printf '# Title\n\nSome text.\n' > "$RUNNER_TEMP/md-inv/clean.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: bogus
          path: ${{ runner.temp }}/md-inv/clean.md
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure for invalid command"; exit 1; fi
          echo "PASS"
