name: Test pinned version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.3.6"
          install-only: "true"
      - name: Assert version
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "version: $VERSION"
          case "$VERSION" in
            0.3.6*) echo "PASS" ;;
            *) echo "FAIL: expected 0.3.6"; exit 1 ;;
          esac
