name: Test pinned version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: latest
        uses: .
        with:
          install-only: "true"
      - id: action
        uses: .
        with:
          version: ${{ steps.latest.outputs.rumdl-version }}
          path: tests/fixtures/rumdl-act/clean.md
          config: tests/fixtures/rumdl-act/rumdl.toml
      - name: Assert pinned version installed
        env:
          EXPECTED: ${{ steps.latest.outputs.rumdl-version }}
          ACTUAL: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "expected: $EXPECTED"
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: version mismatch"
            exit 1
          fi
          echo "PASS"
