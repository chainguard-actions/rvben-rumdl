name: Test pinned version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: latest
        uses: .
        with:
          install-only: "true"
      - id: action
        uses: .
        with:
          install-only: "true"
          version: ${{ steps.latest.outputs.rumdl-version }}
      - name: Assert pinned version installed
        env:
          LATEST: ${{ steps.latest.outputs.rumdl-version }}
          PINNED: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "latest: $LATEST"
          echo "pinned: $PINNED"
          if [ -z "$PINNED" ] || [ "$PINNED" != "$LATEST" ]; then
            echo "FAIL: pinned version mismatch"
            exit 1
          fi
          echo "PASS"
