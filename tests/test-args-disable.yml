name: Test extra args disable a rule
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Baseline - very long line fails without args
        id: baseline
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/verylongline
      - id: action
        uses: .
        with:
          path: tests/fixtures/verylongline
          args: --disable MD013
      - name: Assert
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "baseline: $BASELINE, with args: $OUTCOME"
          if [ "$BASELINE" != "failure" ]; then
            echo "FAIL: baseline should fail on MD013"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with MD013 disabled"
            exit 1
          fi
          echo "PASS"
