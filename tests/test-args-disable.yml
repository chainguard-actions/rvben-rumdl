name: Test args disables a rule
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: without_args
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/trailing.md
          config: tests/fixtures/rumdl.toml
      - id: action
        uses: .
        with:
          path: tests/fixtures/trailing.md
          config: tests/fixtures/rumdl.toml
          args: --disable MD009
      - name: Assert args changed outcome
        env:
          WITHOUT: ${{ steps.without_args.outcome }}
          WITH: ${{ steps.action.outcome }}
        run: |
          echo "without args: $WITHOUT, with args: $WITH"
          if [ "$WITHOUT" != "failure" ]; then
            echo "FAIL: expected MD009 violation without args"
            exit 1
          fi
          if [ "$WITH" != "success" ]; then
            echo "FAIL: expected success with --disable MD009"
            exit 1
          fi
          echo "PASS"
