name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/act-fixtures/bad.md
          config: tests/act-fixtures/rumdl-disable.toml
      - name: Assert action succeeded with violations disabled by config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "outcome: $OUTCOME, version: $VERSION"
          if [ "$OUTCOME" != "success" ] || [ -z "$VERSION" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
