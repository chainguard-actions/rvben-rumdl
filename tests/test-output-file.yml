name: Test output-file option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/md-output"
          printf 'some text\n# heading without blank line\nmore text\n' \
            > "$GITHUB_WORKSPACE/tests/fixtures/md-output/input.md"

      - id: action
        uses: .
        with:
          command: check
          path: tests/fixtures/md-output/input.md
          fail-on-error: "false"
          output-file: tests/fixtures/md-output/results.txt

      - name: Assert output file was created
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/tests/fixtures/md-output/results.txt"
          echo "Checking for output file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: output file was not created at '$OUTPUT_FILE'"
            exit 1
          fi
          echo "Output file contents:"
          cat "$OUTPUT_FILE"
          echo "PASS: output file exists"

      - name: Assert rumdl-version output is set
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "rumdl-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version output is empty"
            exit 1
          fi
          echo "PASS: rumdl-version is '$VERSION'"
