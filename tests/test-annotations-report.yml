name: Test annotations report-type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean markdown file for annotations mode
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/md-annotations"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/md-annotations/clean.md" << 'EOF'
          # Title

          This is a clean markdown file.

          ## Section

          Content here.
          EOF

      - id: action
        uses: .
        with:
          command: check
          path: tests/fixtures/md-annotations/clean.md
          report-type: annotations
          fail-on-error: "true"

      - name: Assert action succeeded with annotations report-type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with annotations report-type on clean file"
            exit 1
          fi
          echo "PASS: annotations report-type works on clean file"

      - name: Assert rumdl-version output is set
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "rumdl-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version output is empty"
            exit 1
          fi
          echo "PASS: rumdl-version is '$VERSION'"
