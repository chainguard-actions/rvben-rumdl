name: Test annotations report-type with clean markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean markdown file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp-ann-md"
          cat > "$GITHUB_WORKSPACE/tmp-ann-md/clean.md" << 'EOF'
          # Clean Document

          This document has no lint violations.

          ## Section

          Content here.
          EOF

      - id: action
        uses: .
        with:
          path: tmp-ann-md/clean.md
          command: check
          report-type: annotations

      - name: Assert rumdl-version output is set
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "rumdl-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version output is empty"
            exit 1
          fi
          echo "PASS: rumdl-version=$VERSION"

      - name: Assert rumdl-path output is set
        env:
          RUMDL_PATH: ${{ steps.action.outputs.rumdl-path }}
        run: |
          echo "rumdl-path: $RUMDL_PATH"
          if [ -z "$RUMDL_PATH" ]; then
            echo "FAIL: rumdl-path output is empty"
            exit 1
          fi
          echo "PASS: rumdl-path=$RUMDL_PATH"
