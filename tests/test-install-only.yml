name: Test install-only puts rumdl on PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-only: "true"
          # Would fail if linting ran; install-only must ignore it
          path: tests/fixtures/dirty.md
      - name: Assert rumdl is on PATH and matches outputs
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
          RPATH: ${{ steps.action.outputs.rumdl-path }}
        run: |
          echo "version: $VERSION"
          echo "path: $RPATH"
          if ! command -v rumdl; then
            echo "FAIL: rumdl not on PATH"
            exit 1
          fi
          out="$(rumdl --version)"
          echo "rumdl --version: $out"
          if [ "$out" != "rumdl $VERSION" ]; then
            echo "FAIL: PATH rumdl version '$out' != 'rumdl $VERSION'"
            exit 1
          fi
          if [ ! -x "$RPATH" ]; then
            echo "FAIL: rumdl-path not executable"
            exit 1
          fi
          echo "PASS"
