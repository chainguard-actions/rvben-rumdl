name: Test basic check on clean markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean markdown file to lint
        run: |
          mkdir -p /tmp/md-test
          cat > /tmp/md-test/clean.md << 'EOF'
          # Hello World

          This is a clean markdown file.

          ## Section

          Some content here.
          EOF

      - id: action
        uses: .
        with:
          command: check
          path: /tmp/md-test/clean.md

      - name: Assert rumdl-version output is set
        env:
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "rumdl-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version output is empty"
            exit 1
          fi
          echo "PASS: rumdl-version=$VERSION"

      - name: Assert rumdl-path output is set
        env:
          RUMDL_PATH: ${{ steps.action.outputs.rumdl-path }}
        run: |
          echo "rumdl-path: $RUMDL_PATH"
          if [ -z "$RUMDL_PATH" ]; then
            echo "FAIL: rumdl-path output is empty"
            exit 1
          fi
          if [ ! -f "$RUMDL_PATH" ]; then
            echo "FAIL: rumdl binary not found at $RUMDL_PATH"
            exit 1
          fi
          echo "PASS: rumdl binary exists at $RUMDL_PATH"
