name: Test extra args disable rule with annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown with MD009 violation and config
        run: |
          mkdir -p "$RUNNER_TEMP/md"
          printf '# Title\n\nSome text. \n' > "$RUNNER_TEMP/md/bad.md"
          printf '[global]\ndisable = ["MD033"]\n' > "$RUNNER_TEMP/rumdl-test.toml"
          echo "MD_DIR=$RUNNER_TEMP/md" >> "$GITHUB_ENV"
          echo "CFG=$RUNNER_TEMP/rumdl-test.toml" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          path: ${{ env.MD_DIR }}/bad.md
          config: ${{ env.CFG }}
          report-type: annotations
          args: --disable MD009
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with MD009 disabled"
            exit 1
          fi
          echo "PASS"
