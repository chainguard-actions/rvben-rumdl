name: Test check fails on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare input files
        run: |
          mkdir -p rumdl-input
          printf '[MD013]\nline-length = 200\n' > rumdl-input/rumdl.toml
          printf '# Title\n\n#Bad heading\n' > rumdl-input/bad.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: rumdl-input/bad.md
          config: rumdl-input/rumdl.toml
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on lint violations"
            exit 1
          fi
          echo "PASS"
