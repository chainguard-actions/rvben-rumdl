name: Test check fails on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown with trailing whitespace
        run: |
          mkdir -p "$RUNNER_TEMP/md-bad"
          printf '# Title\n\nSome text with trailing space. \n' > "$RUNNER_TEMP/md-bad/bad.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/md-bad/bad.md
          config: tests/fixtures/rumdl-test.toml
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          echo "PASS"
