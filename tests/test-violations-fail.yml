name: Test violations fail the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/dirty.md
          config: tests/fixtures/rumdl.toml
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.rumdl-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on lint violations"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "FAIL: rumdl-version should still be set after install"
            exit 1
          fi
          echo "PASS"
